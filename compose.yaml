name: sponsorship
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      SPONSOR_PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - research:/data/research
      - auth:/data/auth
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
volumes:
  research:
  auth:
  caddy_data:
  caddy_config:
